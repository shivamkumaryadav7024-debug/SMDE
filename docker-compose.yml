services:
  postgres:
    image: postgres:16-alpine
    container_name: maritime_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: maritime
      POSTGRES_PASSWORD: maritime_pass
      POSTGRES_DB: maritime_docs
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maritime -d maritime_docs"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
